<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لیست املاک</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <style>body { font-family: 'Vazirmatn', sans-serif; background: #f8f9fa; }</style>
</head>
<body>
    <div class="container my-5">
        <h2 class="fw-bold mb-4">لیست املاک ثبت شده</h2>
        
        <!-- فرم فیلتر -->
        <form method="GET" class="row g-3 bg-white p-3 rounded shadow-sm mb-4">
            <div class="col-md-4">
                <input type="text" name="q" class="form-control" placeholder="جستجو در عنوان آگهی..." value="{{ request.GET.q }}">
            </div>
            <div class="col-md-3">
                <select name="transaction_type" class="form-select">
                    <option value="">همه معاملات</option>
                    <option value="sale" {% if request.GET.transaction_type == 'sale' %}selected{% endif %}>فروش</option>
                    <option value="rent" {% if request.GET.transaction_type == 'rent' %}selected{% endif %}>رهن و اجاره</option>
                </select>
            </div>
            <div class="col-md-3">
                <select name="property_type" class="form-select">
                    <option value="">همه انواع ملک</option>
                    <option value="apartment" {% if request.GET.property_type == 'apartment' %}selected{% endif %}>آپارتمان</option>
                    <option value="house" {% if request.GET.property_type == 'house' %}selected{% endif %}>ویلایی / خانه</option>
                    <option value="land" {% if request.GET.property_type == 'land' %}selected{% endif %}>زمین / کلنگی</option>
                    <option value="commercial" {% if request.GET.property_type == 'commercial' %}selected{% endif %}>تجاری / اداری</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">فیلتر</button>
            </div>
        </form>

        <!-- شبکه‌ی املاک -->
        <div class="row g-4">
            {% for prop in properties %}
            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    {% if prop.image %}
                        <img src="{{ prop.image.url }}" class="card-img-top" style="height: 200px; object-fit: cover;">
                    {% else %}
                        <img src="https://via.placeholder.com/400x200?text=بدون+تصویر" class="card-img-top" style="height: 200px; object-fit: cover;">
                    {% endif %}
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{ prop.title }}</h5>
                        <p class="text-muted small mb-2">📍 {{ prop.city }} - {{ prop.address }}</p>
                        <p class="fw-bold text-primary mt-auto">{{ prop.price }} تومان</p>
                        <a href="{% url 'property_detail' prop.pk %}" class="btn btn-outline-primary btn-sm w-100 mt-2">مشاهده جزئیات</a>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-12 text-center py-5">
                <p class="text-muted">هیچ ملکی یافت نشد.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
